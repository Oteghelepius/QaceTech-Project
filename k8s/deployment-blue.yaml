apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinatra-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sinatra-green
  template:
    metadata:
      labels:
        app: sinatra-green
    spec:
      containers:
      - name: sinatra
        image: pius20/sinatra-cats:1.0.0
        ports:
        - containerPort: 4567
        resources: 
            limits: 
              cpu: 200m
              memory: 300Mi
            requests: 
              cpu: 100m
              memory: 200Mi
