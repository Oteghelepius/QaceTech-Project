name: CI/CD Pipeline - Sinatra Cats App

on:
  push:
    branches:
      - main  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install dependencies
      run: gem install sinatra json

    - name: Test app loads correctly
      run: ruby -e "require 'sinatra'; require './cats/config/lib/cats.rb'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: pius20/my-sinatra-app:latest

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Update kubeconfig for EKS cluster
      run: |
        aws eks update-kubeconfig --region eu-north-1 --name sinatra-cluster

    - name: Deploy to EKS (Rolling Update)
      run: |
        kubectl set image deployment/sinatra-blue sinatra=pius20/my-sinatra-app:latest
        kubectl rollout status deployment/sinatra-blue
        kubectl patch service sinatra-service -p '{"spec":{"selector":{"app":"sinatra-blue"}}}'

        